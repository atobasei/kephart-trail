[project]
name = "kephart-trail"
version = "0.1.0"
description = "An open-source, old-school hiking forum for Great Smoky Mountains National Park."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth>=65.21.0",
    "django-environ>=0.12",
    "markdown>=3.11.2",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations; long lines there aren't worth hand-editing.
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kephart", "accounts", "parks", "forum", "profiles", "moderation", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kephart.settings.dev"
python_files = ["test_*.py"]
addopts = "--strict-markers"
