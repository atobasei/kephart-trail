{% extends "base.html" %}

{% block title %}Edit post · {{ SITE_NAME }}{% endblock %}

{% block content %}
  <h1>Edit post</h1>
  <p class="muted">In “{{ post.thread.title }}”. Edits are marked “edited”.</p>
  <form class="stacked-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
    <a href="{{ post.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
